  /**
   * Returns a breadcrumb string for a message key, e.g. "Arc 1 › Chapter 1"
   */
  function getMessageBreadcrumb(key) {
    const crumbs = [];
    function walk(nodes, trail) {
      for (const node of nodes) {
        const newTrail = [...trail, node.title];
        if (node.messages.includes(key)) { crumbs.push(...newTrail); return true; }
        if (node.children.length && walk(node.children, newTrail)) return true;
      }
      return false;
    }
    walk(project.structure, []);
    return crumbs.join(" › ");
  }

  function addBookmark(key, label) {
    if (bookmarks.find(b => b.key === key)) return;
    const msg      = project.messages[key];
    const preview  = msg ? msg.mes.replace(/\s+/g, " ").trim().slice(0, 150) : "";
    const location = getMessageBreadcrumb(key);
    bookmarks.push({
      key,
      label:    label || (msg ? msg.name : key),
      preview,
      location,
      index:    msg ? msg.msg_index : null,
    });
    saveBookmarks();
    renderBookmarkPanel();
    syncBookmarkIcons();
  }

  function removeBookmark(key) {
    bookmarks = bookmarks.filter(b => b.key !== key);
    saveBookmarks();
    renderBookmarkPanel();
    syncBookmarkIcons();
  }

  /**
   * Updates the .bookmarked class on all hint icons to match current bookmarks.
   */
  function syncBookmarkIcons() {
    document.querySelectorAll(".msg-bm-hint").forEach(el => {
      const key = el.closest(".msg-wrap").dataset.key;
      el.classList.toggle("bookmarked", !!bookmarks.find(b => b.key === key));
    });
  }

  function renderBookmarkPanel() {
    const panel = document.getElementById("bookmark-panel");
    panel.innerHTML = "";

    // Fixed nav items
    const mkNav = (label, onClick) => {
      const btn = document.createElement("button");
      btn.className   = "bm-item bm-special";
      btn.textContent = label;
      btn.addEventListener("click", () => { onClick(); toggleBookmarkPanel(false); });
      return btn;
    };
    panel.appendChild(mkNav("↑ Jump to beginning", () => scrollToBeginning()));
    panel.appendChild(mkNav("↓ Jump to end",        () => scrollToEnd()));

    if (!bookmarks.length) {
      const empty = document.createElement("div");
      empty.className = "bm-empty";
      empty.textContent = "No bookmarks yet — click 🔖 on any message.";
      panel.appendChild(empty);
      return;
    }

    for (const bm of bookmarks) {
      const card = document.createElement("div");
      card.className = "bm-card";

      // Top row: speaker name + index + delete button
      const top = document.createElement("div");
      top.className = "bm-card-top";

      const nameEl = document.createElement("span");
      nameEl.className   = "bm-card-name";
      nameEl.textContent = bm.label;

      const idxEl = document.createElement("span");
      idxEl.className   = "bm-card-index";
      idxEl.textContent = bm.index !== null && bm.index !== undefined ? "#" + bm.index : "";

      const del = document.createElement("button");
      del.className   = "bm-card-del";
      del.textContent = "×";
      del.title       = "Remove bookmark";
      del.addEventListener("click", e => { e.stopPropagation(); removeBookmark(bm.key); });

      top.appendChild(nameEl);
      top.appendChild(idxEl);
      top.appendChild(del);
      card.appendChild(top);

      // Location breadcrumb
      if (bm.location) {
        const loc = document.createElement("div");
        loc.className   = "bm-card-location";
        loc.textContent = bm.location;
        card.appendChild(loc);
      }

      // Text preview
      if (bm.preview) {
        const prev = document.createElement("div");
        prev.className   = "bm-card-preview";
        prev.textContent = bm.preview.length >= 150 ? bm.preview + "…" : bm.preview;
        card.appendChild(prev);
      }

      // Click the card body (not delete) to jump
      card.addEventListener("click", () => {
        scrollToMessage(bm.key);
        toggleBookmarkPanel(false);
      });

      panel.appendChild(card);
    }
  }

  // --------------------------------------------------------------------------
  // SECTION 15: UTILITIES
  // --------------------------------------------------------------------------

  function escapeHtml(str) {
    if (!str) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  /**
   * Renders a subset of Markdown to HTML.
   * Input is PLAIN TEXT (not yet HTML-escaped).
   * Handles: ***bold italic***, **bold**, *italic*, __bold__, _italic_,
   *          ~~strikethrough~~, `inline code`, > blockquote lines.
   * Single newlines become <br>. Does NOT handle headers, lists, or block code.
   *
   * Order matters: escape HTML first so we don't mangle user text,
   * then apply patterns to the escaped string.
   */
  function renderMarkdown(text) {
    if (!text) return "";

    // Step 1 — split into lines so we can handle blockquotes line by line,
    // then rejoin. We process inline markdown per-line.
    const lines = text.split(/\r?\n/);
    const processed = lines.map(line => {
      // Escape HTML first so user's < > & are safe
      let s = escapeHtml(line);

      // Blockquote: lines starting with "> "
      if (/^&gt;\s?/.test(s)) {
        s = '<span class="md-blockquote">' + s.replace(/^&gt;\s?/, "") + "</span>";
        return s;
      }

      // Bold italic (must come before bold and italic individually)
      s = s.replace(/\*\*\*(.*?)\*\*\*/g, "<strong><em>$1</em></strong>");
      s = s.replace(/___(.+?)___/g,        "<strong><em>$1</em></strong>");

      // Bold
      s = s.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/__(.+?)__/g,      "<strong>$1</strong>");

      // Italic — * and _ variants.
      // Use a negative lookbehind/ahead to avoid matching inside words for _
      s = s.replace(/\*(.*?)\*/g, "<em>$1</em>");
      s = s.replace(/(?<!\w)_(.+?)_(?!\w)/g, "<em>$1</em>");

      // Strikethrough
      s = s.replace(/~~(.*?)~~/g, "<del>$1</del>");

      // Inline code — preserve content literally (already escaped above)
      s = s.replace(/`([^`]+)`/g, "<code>$1</code>");

      return s;
    });

    // Rejoin with <br> for single newlines
    return processed.join("<br>");
  }

  // --------------------------------------------------------------------------
  // SECTION 15b: SEARCH OVERLAY
  // --------------------------------------------------------------------------

  // Masterlist schema:
  //   { "indices": [ { "name": "Wren", "url": "…" }, … ] }
  //
  // Each author index schema:
  //   { "author": "Wren", "stories": [ { "title": "…", "url": "…", "description": "…", "tags": ["fantasy", "romance"] }, … ] }
  // tags is optional — omitting it is fine, the story just won't appear in tag filters.

  const MASTERLIST_URL = "./masterlist.json";

  // Cache fetched author indices so we don't re-fetch on every open
  // Map<authorName, { status: "loading"|"ok"|"error", stories: [], error: "" }>
  const authorIndexCache = new Map();

  // The full masterlist entries: [{ name, url }]
  let masterlistEntries = null;
  let masterlistStatus  = "idle"; // "idle" | "loading" | "ok" | "error"

  // Tag filter state
  let tagSearchMode  = false;       // whether tag filter bar is open
  let activeTags     = new Set();   // currently selected tags (AND filter)
  let allTagsFetched = false;       // true once fetchAllIndexes has completed

  // Debounce timer for search input
  let searchDebounce = null;

  function openSearchOverlay() {
    document.getElementById("search-overlay").classList.add("open");
    document.getElementById("search-input").focus();

    // Fetch masterlist if we haven't yet
    if (masterlistStatus === "idle") {
      fetchMasterlist();
    } else {
      // Already have it — just render current state
      renderSearchResults(document.getElementById("search-input").value.trim());
    }
  }

  function closeSearchOverlay() {
    document.getElementById("search-overlay").classList.remove("open");
  }

  function fetchMasterlist() {
    masterlistStatus = "loading";
    setSearchStatus("Fetching story index…", false);
    showSearchSpinner(true);

    fetch(MASTERLIST_URL)
      .then(r => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(data => {
        if (!data.indices || !Array.isArray(data.indices)) {
          throw new Error("masterlist.json is missing an 'indices' array");
        }
        masterlistEntries = data.indices;
        masterlistStatus  = "ok";
        showSearchSpinner(false);
        setSearchStatus(masterlistEntries.length + " author(s) in index", false);
        if (tagSearchMode) fetchAllIndexes();
        renderSearchResults(document.getElementById("search-input").value.trim());
      })
      .catch(err => {
        masterlistStatus = "error";
        showSearchSpinner(false);
        setSearchStatus("Could not load masterlist.json — " + err.message, true);
      });
  }

  /**
   * Lazily fetches one masterlist entry and caches the result.
   * Auto-detects whether the URL points to:
   *   - An author index  ({ "stories": [...] })
   *   - A direct payload ({ "schema_version": 1, ... })
   * Both are normalised into the same cache shape: { status, stories, error }
   * A direct payload becomes a single-story list using the payload's own meta.
   */
  function fetchAuthorIndex(entry) {
    const name = entry.name;

    if (authorIndexCache.has(name)) {
      return Promise.resolve();
    }

    // Mark as loading immediately so concurrent calls don't double-fetch
    authorIndexCache.set(name, { status: "loading", stories: [], error: "" });

    const controller = new AbortController();
    const timeout    = setTimeout(() => controller.abort(), 5000);

    return fetch(entry.url, { signal: controller.signal })
      .then(r => {
        clearTimeout(timeout);
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(data => {
        let stories;

        if (Array.isArray(data.stories)) {
          // Author index format — use as-is
          stories = data.stories;
        } else if (data.schema_version !== undefined && data.meta) {
          // Direct payload — wrap it as a single story entry
          stories = [{
            title:       data.meta.title       || "Untitled",
            description: data.meta.description || "",
            url:         entry.url,
          }];
        } else {
          throw new Error("Unrecognised format — expected a 'stories' array or a payload with 'schema_version'");
        }

        authorIndexCache.set(name, { status: "ok", stories, error: "" });
      })
      .catch(err => {
        clearTimeout(timeout);
        const msg = err.name === "AbortError" ? "timed out" : err.message;
        authorIndexCache.set(name, { status: "error", stories: [], error: msg });
      })
      .then(() => {
        renderSearchResults(document.getElementById("search-input").value.trim());
      });
  }

  /**
   * Fetches every author index that isn't already cached.
   * Each request races against a 5-second timeout via AbortController.
   * Failed/timed-out entries are marked as errored and skipped gracefully.
   * Progress is shown in the tag filter bar as "Loading indexes… N/M".
   */
  function fetchAllIndexes() {
    // Masterlist not ready yet — toggleTagSearch will retry via fetchMasterlist's callback
    if (!masterlistEntries) return;

    // Already done — just re-render the cloud (covers re-opens)
    if (allTagsFetched) {
      renderTagCloud();
      return;
    }

    const unfetched = masterlistEntries.filter(e => !authorIndexCache.has(e.name));
    if (!unfetched.length) {
      // Everything already cached from lazy loads
      allTagsFetched = true;
      renderTagCloud();
      return;
    }

    let completed = 0;
    const total   = unfetched.length;
    const alreadyDone = masterlistEntries.length - total;

    function updateProgress() {
      const done = alreadyDone + completed;
      const all  = masterlistEntries.length;
      document.getElementById("tag-filter-status").textContent =
        `Loading indexes… ${done}/${all}`;
    }

    updateProgress();

    const fetches = unfetched.map(entry => {
      // Mark as loading before firing so renderSearchResults shows the right state
      authorIndexCache.set(entry.name, { status: "loading", stories: [], error: "" });

      const controller = new AbortController();
      const timeout    = setTimeout(() => controller.abort(), 5000);

      return fetch(entry.url, { signal: controller.signal })
        .then(r => {
          clearTimeout(timeout);
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(data => {
          let stories;
          if (Array.isArray(data.stories)) {
            stories = data.stories;
          } else if (data.schema_version !== undefined && data.meta) {
            stories = [{
              title:       data.meta.title       || "Untitled",
              description: data.meta.description || "",
              url:         entry.url,
            }];
          } else {
            throw new Error("Unrecognised format");
          }
          authorIndexCache.set(entry.name, { status: "ok", stories, error: "" });
        })
        .catch(err => {
          clearTimeout(timeout);
          const msg = err.name === "AbortError" ? "timed out" : err.message;
          authorIndexCache.set(entry.name, { status: "error", stories: [], error: msg });
        })
        .then(() => {
          completed++;
          updateProgress();
        });
    });

    Promise.all(fetches).then(() => {
      allTagsFetched = true;
      renderTagCloud();
      renderSearchResults(document.getElementById("search-input").value.trim());
    });
  }

  /**
   * Collects every unique tag from all cached (ok) author indexes,
   * sorts them alphabetically, and renders them as pills in the tag cloud.
   */
  function renderTagCloud() {
    const statusEl = document.getElementById("tag-filter-status");
    const cloudEl  = document.getElementById("tag-pill-cloud");
    cloudEl.innerHTML = "";

    // Gather all tags
    const tagSet = new Set();
    for (const [, cache] of authorIndexCache) {
      if (cache.status !== "ok") continue;
      for (const story of cache.stories) {
        if (Array.isArray(story.tags)) {
          story.tags.forEach(t => tagSet.add(t.trim().toLowerCase()));
        }
      }
    }

    const tags = Array.from(tagSet).sort();

    if (!allTagsFetched) {
      // Still fetching — status text is being set by updateProgress, don't overwrite
      return;
    } else if (!tags.length) {
      statusEl.textContent = "No tags found in any index.";
      return;
    } else {
      statusEl.textContent = tags.length + " tag" + (tags.length === 1 ? "" : "s") + " found" +
        (activeTags.size ? ` — ${activeTags.size} active` : "");
    }

    for (const tag of tags) {
      const pill = document.createElement("button");
      pill.className   = "tag-pill" + (activeTags.has(tag) ? " active" : "");
      pill.textContent = tag;
      pill.addEventListener("click", () => toggleActiveTag(tag));
      cloudEl.appendChild(pill);
    }
  }

  /**
   * Toggles a tag in the active filter set and re-renders.
   */
  function toggleActiveTag(tag) {
    if (activeTags.has(tag)) {
      activeTags.delete(tag);
    } else {
      activeTags.add(tag);
    }
    renderTagCloud();
    renderSearchResults(document.getElementById("search-input").value.trim());
  }

  /**
   * Opens/closes the tag filter bar and triggers eager-fetch if needed.
   */
  function toggleTagSearch() {
    tagSearchMode = !tagSearchMode;
    document.getElementById("tag-filter-bar").classList.toggle("open", tagSearchMode);
    document.getElementById("btn-tag-search").classList.toggle("active", tagSearchMode);

    if (tagSearchMode) {
      // Ensure masterlist is loaded first
      if (masterlistStatus === "ok") {
        fetchAllIndexes();
      } else if (masterlistStatus === "idle") {
        // fetchMasterlist will call renderSearchResults when done;
        // we hook in by setting a flag so openSearchOverlay's flow carries through
        fetchMasterlist();
      }
    } else {
      // Clear active tags when closing tag mode
      activeTags.clear();
      renderSearchResults(document.getElementById("search-input").value.trim());
    }
  }

  /**
   * Main render function for the search results pane.
   * Called on: masterlist load, author index load, search input change.
   */
  function renderSearchResults(query) {
    const container = document.getElementById("search-results");
    container.innerHTML = "";

    if (masterlistStatus === "loading") {
      container.innerHTML = '<div class="sr-empty">Loading index…</div>';
      return;
    }
    if (masterlistStatus === "error" || !masterlistEntries) {
      container.innerHTML = '<div class="sr-empty">Could not load story index.</div>';
      return;
    }
    if (!masterlistEntries.length) {
      container.innerHTML = '<div class="sr-empty">No authors in the index yet.</div>';
      return;
    }

    const q = query.toLowerCase();

    let anyVisible = false;

    for (const entry of masterlistEntries) {
      const cache = authorIndexCache.get(entry.name);

      // Filter stories if we have them; if not yet loaded, show the author
      // regardless of query so the user can click to expand and trigger the load.
      let visibleStories = [];
      if (cache && cache.status === "ok") {
        visibleStories = cache.stories.filter(s => {
          // Text filter
          if (q) {
            const inTitle  = (s.title       || "").toLowerCase().includes(q);
            const inAuthor = (entry.name    || "").toLowerCase().includes(q);
            const inDesc   = (s.description || "").toLowerCase().includes(q);
            const inTags   = Array.isArray(s.tags) && s.tags.some(t => t.toLowerCase().includes(q));
            if (!inTitle && !inAuthor && !inDesc && !inTags) return false;
          }
          // Tag filter (AND — story must have every active tag)
          if (activeTags.size) {
            const storyTags = new Set((s.tags || []).map(t => t.trim().toLowerCase()));
            for (const tag of activeTags) {
              if (!storyTags.has(tag)) return false;
            }
          }
          return true;
        });
      }

      // If we have loaded data and both filters eliminate all stories, skip the author
      if (cache && cache.status === "ok" && !visibleStories.length &&
          (q ? !entry.name.toLowerCase().includes(q) : true) &&
          (activeTags.size || q)) {
        continue;
      }

      anyVisible = true;

      const group = document.createElement("div");
      group.className  = "sr-author-group";
      group.dataset.author = entry.name;

      // Author header row
      const header = document.createElement("div");
      header.className = "sr-author-header";

      const toggle = document.createElement("span");
      toggle.className   = "sr-author-toggle";
      toggle.textContent = "▶";

      const nameEl = document.createElement("span");
      nameEl.className   = "sr-author-name";
      nameEl.textContent = entry.name;

      const meta = document.createElement("span");
      if (!cache) {
        meta.className   = "sr-author-loading";
        meta.textContent = "click to expand";
      } else if (cache.status === "loading") {
        meta.className   = "sr-author-loading";
        meta.textContent = "loading…";
      } else if (cache.status === "error") {
        meta.className   = "sr-author-error";
        meta.textContent = "failed to load";
      } else {
        meta.className   = "sr-author-count";
        meta.textContent = visibleStories.length + " stor" + (visibleStories.length === 1 ? "y" : "ies");
      }

      header.appendChild(toggle);
      header.appendChild(nameEl);
      header.appendChild(meta);
      group.appendChild(header);

      // Story list
      const storyList = document.createElement("div");
      storyList.className = "sr-story-list";

      if (cache && cache.status === "error") {
        const errEl = document.createElement("div");
        errEl.style.cssText = "padding:0.5rem 1.25rem 0.5rem 2.5rem;";
        errEl.className     = "sr-author-error";
        errEl.textContent   = "Could not load index: " + cache.error;
        storyList.appendChild(errEl);
      } else if (cache && cache.status === "ok") {
        for (const story of visibleStories) {
          storyList.appendChild(buildStoryItem(story, entry.name, q));
        }
        if (!visibleStories.length && q) {
          const none = document.createElement("div");
          none.style.cssText = "padding:0.5rem 1.25rem 0.5rem 2.5rem;font-size:0.75rem;color:var(--ui-text-dim);font-style:italic;";
          none.textContent   = "No matching stories.";
          storyList.appendChild(none);
        }
      }
      // If not yet loaded, story list stays empty until clicked

      group.appendChild(storyList);

      // Toggle open/close and lazy-load on click
      header.addEventListener("click", () => {
        const isOpen = group.classList.toggle("open");
        if (isOpen && !authorIndexCache.has(entry.name)) {
          fetchAuthorIndex(entry);
        }
      });

      // Auto-expand if there's an active query or tag filter (helps discovery)
      if ((q || activeTags.size) && cache && cache.status === "ok" && visibleStories.length) {
        group.classList.add("open");
      }

      container.appendChild(group);
    }

    if (!anyVisible && q) {
      container.innerHTML = '<div class="sr-empty">No stories match "' + escapeHtml(query) + '".</div>';
    }
  }

  /**
   * Builds a single story row with highlighted match text.
   */
  function buildStoryItem(story, authorName, q) {
    const item = document.createElement("div");
    item.className = "sr-story-item";

    const body = document.createElement("div");
    body.className = "sr-story-body";

    const titleEl = document.createElement("div");
    titleEl.className   = "sr-story-title";
    titleEl.innerHTML   = q ? highlight(story.title || "Untitled", q) : escapeHtml(story.title || "Untitled");
    body.appendChild(titleEl);

    // Tags — between title and description
    if (Array.isArray(story.tags) && story.tags.length) {
      const tagsRow = document.createElement("div");
      tagsRow.className = "sr-story-tags";
      for (const tag of story.tags) {
        const pill = document.createElement("button");
        const normalised = tag.trim().toLowerCase();
        pill.className   = "sr-story-tag" + (activeTags.has(normalised) ? " active" : "");
        pill.textContent = normalised;
        pill.addEventListener("click", e => {
          e.stopPropagation();
          // Enable tag mode if not already on
          if (!tagSearchMode) {
            tagSearchMode = true;
            document.getElementById("tag-filter-bar").classList.add("open");
            document.getElementById("btn-tag-search").classList.add("active");
            fetchAllIndexes();
          }
          toggleActiveTag(normalised);
        });
        tagsRow.appendChild(pill);
      }
      body.appendChild(tagsRow);
    }

    if (story.description) {
      const descEl = document.createElement("div");
      descEl.className = "sr-story-desc";
      descEl.innerHTML = q ? highlight(story.description, q) : escapeHtml(story.description);
      body.appendChild(descEl);
    }

    item.appendChild(body);

    const loadBtn = document.createElement("button");
    loadBtn.className   = "sr-story-load-btn";
    loadBtn.textContent = "Read →";
    loadBtn.addEventListener("click", e => {
      e.stopPropagation();
      loadStoryFromSearch(story.url);
    });
    item.appendChild(loadBtn);

    // Clicking the row body (not a tag or button) also loads
    item.addEventListener("click", () => loadStoryFromSearch(story.url));

    return item;
  }

  /**
   * Wraps query matches in a highlight span. Input is plain text, output is HTML.
   */
  function highlight(text, query) {
    if (!query) return escapeHtml(text);
    const escaped = escapeHtml(text);
    const escapedQ = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    return escaped.replace(
      new RegExp(escapedQ.replace(/&amp;|&lt;|&gt;|&quot;/g, "."), "gi"),
      m => '<span class="sr-match">' + m + "</span>"
    );
  }

  /**
   * Loads a story from a URL found in search results.
   * Closes the overlay, shows loading screen, fetches and loads.
   */
  function loadStoryFromSearch(url) {
    closeSearchOverlay();
    document.getElementById("loading-screen").style.display = "flex";
    document.getElementById("loading-screen").classList.remove("fade-out");
    setLoadingStatus("Loading story…");
    storyUrl = url;
    fetchAndLoad(url);
  }

  function setSearchStatus(msg, isError) {
    const el = document.getElementById("search-status");
    el.textContent = msg;
    el.classList.toggle("error", !!isError);
  }

  function showSearchSpinner(visible) {
    document.getElementById("search-spinner").style.display = visible ? "block" : "none";
  }

  // --------------------------------------------------------------------------
  // SECTION 15c: FONT SIZE OVERRIDE
  // --------------------------------------------------------------------------

  /**
   * Applies the current userFontScale to all rendered bubble bodies
   * without a full re-render. Iterates all three streams so switching
   * layout immediately reflects the scale.
   */
  function applyFontScale() {
    document.querySelectorAll(".bubble-body").forEach(body => {
      const wrap    = body.closest(".msg-wrap");
      if (!wrap) return;
      const key     = wrap.dataset.key;
      if (!key || !project) return;
      const style   = STSS.resolveStyle(project, key);
      const rawSize = style.font_size || "1rem";
      const baseRem = parseFloat(rawSize) || 1.0;
      body.style.fontSize = (baseRem * userFontScale) + "rem";
    });
    saveSetting("fontScale", userFontScale);
  }

  /**
   * Updates the slider and readout to reflect the current userFontScale.
   */
  function syncFontSizeUI() {
    const slider  = document.getElementById("font-size-slider");
    const readout = document.getElementById("font-size-value");
    if (slider)  slider.value = userFontScale;
    if (readout) readout.textContent = userFontScale.toFixed(2) + "×";
  }

  // --------------------------------------------------------------------------
  // SECTION 15d: POPOUT LAYER
  // Surfaces the current background + portrait above the reader content
  // without covering any UI chrome (sidebar z 20, float-controls z 30).
  // --------------------------------------------------------------------------

  /**
   * Reads the current live state of #bg-layer and the active VN portrait,
   * mirrors them into #popout-layer, and toggles visibility.
   */
  function togglePopout() {
    popoutActive = !popoutActive;
    const btn    = document.getElementById("btn-popout");
    const layer  = document.getElementById("popout-layer");
    const popBg  = document.getElementById("popout-bg");
    const popImg = document.getElementById("popout-portrait-img");

    btn.classList.toggle("active", popoutActive);

    if (popoutActive) {
      // Mirror background from the live bg-layer
      const bgLayer = document.getElementById("bg-layer");
      popBg.style.backgroundImage = bgLayer.style.backgroundImage || "";
      popBg.style.backgroundColor = bgLayer.style.backgroundColor || "";

      // Grab the currently visible portrait (works across all layout modes)
      let portraitSrc = null;
      if (layoutMode === "vn") {
        // Whichever slot is currently visible
        const a = document.getElementById("vn-portrait-a");
        const b = document.getElementById("vn-portrait-b");
        portraitSrc = (vnActiveSlot === "a" && !a.classList.contains("hidden"))
          ? a.src
          : (!b.classList.contains("hidden") ? b.src : null);
      } else if (layoutMode === "vnm") {
        const a = document.getElementById("vnm-portrait-a");
        const b = document.getElementById("vnm-portrait-b");
        portraitSrc = (vnmActiveSlot === "a" && !a.classList.contains("hidden"))
          ? a.src
          : (!b.classList.contains("hidden") ? b.src : null);
      } else {
        // Fullscreen — use the most recently resolved portrait from the project
        portraitSrc = vnCurrentPortrait
          ? STSS.resolveImage(project, vnCurrentPortrait)
          : null;
      }

      if (portraitSrc && portraitSrc !== window.location.href) {
        // window.location.href guard: empty src resolves to the page URL
        popImg.src = portraitSrc;
        popImg.classList.add("visible");
      } else {
        popImg.src = "";
        popImg.classList.remove("visible");
      }

      layer.classList.add("active");
    } else {
      layer.classList.remove("active");
      // Clean up after transition
      setTimeout(() => {
        if (!popoutActive) {
          popImg.src = "";
          popImg.classList.remove("visible");
        }
      }, 450);
    }
  }

  // --------------------------------------------------------------------------
  // SECTION 16: WIRE ALL BUTTONS
  // --------------------------------------------------------------------------

  function wireButtons() {
    // Sidebar toggle
    document.getElementById("btn-sidebar-toggle").addEventListener("click", toggleSidebar);

    // Mute button (shows volume panel inline; clicking icon toggles mute)
    document.getElementById("btn-mute").addEventListener("click", function(e) {
      e.stopPropagation();
      // Toggle volume panel visibility
      const vp = document.getElementById("volume-panel");
      const isOpen = vp.classList.toggle("open");
      toggleBookmarkPanel(false);
      this.classList.toggle("active", isMuted || isOpen);
    });

    // Volume slider
    document.getElementById("volume-slider").addEventListener("input", function() {
      const vol = parseFloat(this.value);
      document.getElementById("audio-music").volume = vol;
      document.getElementById("audio-sting").volume = vol;
      // If volume > 0 and was muted, unmute
      if (vol > 0 && isMuted) {
        isMuted = false;
        document.getElementById("audio-music").muted = false;
        document.getElementById("audio-sting").muted = false;
        document.getElementById("btn-mute").textContent = "🔊";
        document.getElementById("btn-mute").classList.remove("active");
      } else if (vol === 0 && !isMuted) {
        isMuted = true;
        document.getElementById("btn-mute").textContent = "🔇";
        document.getElementById("btn-mute").classList.add("active");
      }
      saveSetting("volume", vol);
      saveSetting("muted", isMuted);
    });

    // Popout button
    document.getElementById("btn-popout").addEventListener("click", function(e) {
      e.stopPropagation();
      togglePopout();
    });

    // Bookmark button
    document.getElementById("btn-bookmark").addEventListener("click", function(e) {
      e.stopPropagation();
      toggleBookmarkPanel();
      document.getElementById("volume-panel").classList.remove("open");
    });

    // Layout buttons
    document.getElementById("btn-layout-fullscreen").addEventListener("click", () => setLayout("fullscreen"));
    document.getElementById("btn-layout-vn").addEventListener("click", () => setLayout("vn"));
    document.getElementById("btn-layout-vnm").addEventListener("click", () => setLayout("vnm"));

    // Font size slider
    document.getElementById("font-size-slider").addEventListener("input", function() {
      userFontScale = parseFloat(this.value);
      document.getElementById("font-size-value").textContent = userFontScale.toFixed(2) + "×";
      applyFontScale();
    });
    document.getElementById("font-size-reset").addEventListener("click", () => {
      userFontScale = 1.0;
      syncFontSizeUI();
      applyFontScale();
    });

    // Download
    document.getElementById("btn-download").addEventListener("click", downloadPayload);

    // Load new story
    document.getElementById("btn-load-new").addEventListener("click", function() {
      document.getElementById("sidebar-file-input").click();
    });
    document.getElementById("sidebar-file-input").addEventListener("change", function(e) {
      if (e.target.files.length) handleDropZoneFile(e.target.files[0]);
      e.target.value = "";
    });

    // Drop zone
    const dzBox = document.getElementById("dz-drop-box");
    const dzFile = document.getElementById("drop-zone-file");

    dzBox.addEventListener("click", () => dzFile.click());
    dzFile.addEventListener("change", e => {
      if (e.target.files.length) handleDropZoneFile(e.target.files[0]);
      e.target.value = "";
    });
    document.getElementById("drop-zone").addEventListener("dragover", e => {
      e.preventDefault();
      document.getElementById("drop-zone").classList.add("dragging");
    });
    document.getElementById("drop-zone").addEventListener("dragleave", () => {
      document.getElementById("drop-zone").classList.remove("dragging");
    });
    document.getElementById("drop-zone").addEventListener("drop", e => {
      e.preventDefault();
      document.getElementById("drop-zone").classList.remove("dragging");
      if (e.dataTransfer.files.length) handleDropZoneFile(e.dataTransfer.files[0]);
    });

    // URL load button
    document.getElementById("dz-url-btn").addEventListener("click", () => {
      const url = document.getElementById("dz-url-input").value.trim();
      if (!url) return;
      document.getElementById("loading-screen").style.display = "flex";
      document.getElementById("loading-screen").classList.remove("fade-out");
      setLoadingStatus("Fetching…");
      hideDropZone();
      fetchAndLoad(url);
    });
    document.getElementById("dz-url-input").addEventListener("keydown", e => {
      if (e.key === "Enter") document.getElementById("dz-url-btn").click();
    });

    // Context menu
    document.getElementById("ctx-bookmark").addEventListener("click", () => {
      if (ctxTargetKey) addBookmark(ctxTargetKey);
      closeCtxMenu();
    });
    document.getElementById("ctx-bookmark-label").addEventListener("click", () => {
      if (!ctxTargetKey) return;
      const label = window.prompt("Bookmark label:");
      if (label !== null) addBookmark(ctxTargetKey, label.trim() || undefined);
      closeCtxMenu();
    });

    // Close context menu and panels on outside click
    document.addEventListener("click", e => {
      if (!e.target.closest("#ctx-menu")) closeCtxMenu();
      if (!e.target.closest("#float-controls")) {
        toggleBookmarkPanel(false);
        document.getElementById("volume-panel").classList.remove("open");
      }
    });

    // Scroll listeners
    document.getElementById("mode-fullscreen").addEventListener("scroll", onScroll, { passive: true });
    document.getElementById("vn-text-panel").addEventListener("scroll", onScroll, { passive: true });
    document.getElementById("vnm-text-panel").addEventListener("scroll", onScroll, { passive: true });

    // Search stories button (sidebar + drop zone)
    document.getElementById("btn-search-stories").addEventListener("click", openSearchOverlay);
    document.getElementById("dz-search-btn").addEventListener("click", openSearchOverlay);

    // Search overlay close button + backdrop click
    document.getElementById("btn-search-close").addEventListener("click", closeSearchOverlay);
    document.getElementById("search-overlay").addEventListener("click", e => {
      if (e.target === document.getElementById("search-overlay")) closeSearchOverlay();
    });

    // Tag search button
    document.getElementById("btn-tag-search").addEventListener("click", toggleTagSearch);

    // Search input — debounced so we don't re-render on every keystroke
    document.getElementById("search-input").addEventListener("input", function() {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(() => {
        renderSearchResults(this.value.trim());
      }, 180);
    });

    // Keyboard shortcuts
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") {
        if (document.getElementById("search-overlay").classList.contains("open")) {
          closeSearchOverlay();
          return;
        }
        if (popoutActive) { togglePopout(); return; }
        closeCtxMenu();
        toggleBookmarkPanel(false);
        document.getElementById("volume-panel").classList.remove("open");
      }
      if (e.key === "[" || e.key === "ArrowLeft") {
        if (e.target.tagName !== "INPUT") scrollToBeginning();
      }
      if (e.key === "]" || e.key === "ArrowRight") {
        if (e.target.tagName !== "INPUT") scrollToEnd();
      }
    });
  }

  // --------------------------------------------------------------------------
  // SECTION 17: APPLY INITIAL STATE AFTER RENDER
  // --------------------------------------------------------------------------

  function applyInitialState() {
    // Apply global background
    applyGlobalBackground();

    // Apply layout mode
    setLayout(layoutMode);

    // Apply mute state
    if (isMuted) {
      document.getElementById("btn-mute").textContent = "🔇";
      document.getElementById("btn-mute").classList.add("active");
    }

    // Apply sidebar state
    if (!sidebarOpen) {
      document.getElementById("sidebar").classList.add("collapsed");
      document.getElementById("btn-sidebar-toggle").classList.remove("active");
    }

    // Restore volume
    const savedVol = loadSetting("volume");
    if (savedVol !== null) {
      document.getElementById("volume-slider").value = savedVol;
      document.getElementById("audio-music").volume = savedVol;
    }

    // Sync font size slider to saved/default value
    syncFontSizeUI();

    // Render bookmark panel
    renderBookmarkPanel();

    // Start global music if set
    if (project.globals.music_url) {
      playMusic(project.globals.music_url);
    }
  }

  // --------------------------------------------------------------------------
  // INIT
  // --------------------------------------------------------------------------

  wireButtons();
  init();

  </script>
