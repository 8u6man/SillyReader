  function setSearchStatus(msg, isError) {
    const el = document.getElementById("search-status");
    el.textContent = msg;
    el.classList.toggle("error", !!isError);
  }

  function showSearchSpinner(visible) {
    document.getElementById("search-spinner").style.display = visible ? "block" : "none";
  }

  // --------------------------------------------------------------------------
  // SECTION 16: WIRE ALL BUTTONS
  // --------------------------------------------------------------------------

  function wireButtons() {
    // Sidebar toggle
    document.getElementById("btn-sidebar-toggle").addEventListener("click", toggleSidebar);

    // Mute button (shows volume panel inline; clicking icon toggles mute)
    document.getElementById("btn-mute").addEventListener("click", function(e) {
      e.stopPropagation();
      // Toggle volume panel visibility
      const vp = document.getElementById("volume-panel");
      const isOpen = vp.classList.toggle("open");
      toggleBookmarkPanel(false);
      this.classList.toggle("active", isMuted || isOpen);
    });

    // Volume slider
    document.getElementById("volume-slider").addEventListener("input", function() {
      const vol = parseFloat(this.value);
      document.getElementById("audio-music").volume = vol;
      document.getElementById("audio-sting").volume = vol;
      // If volume > 0 and was muted, unmute
      if (vol > 0 && isMuted) {
        isMuted = false;
        document.getElementById("audio-music").muted = false;
        document.getElementById("audio-sting").muted = false;
        document.getElementById("btn-mute").textContent = "🔊";
        document.getElementById("btn-mute").classList.remove("active");
      } else if (vol === 0 && !isMuted) {
        isMuted = true;
        document.getElementById("btn-mute").textContent = "🔇";
        document.getElementById("btn-mute").classList.add("active");
      }
      saveSetting("volume", vol);
      saveSetting("muted", isMuted);
    });

    // Bookmark button
    document.getElementById("btn-bookmark").addEventListener("click", function(e) {
      e.stopPropagation();
      toggleBookmarkPanel();
      document.getElementById("volume-panel").classList.remove("open");
    });

    // Layout buttons
    document.getElementById("btn-layout-fullscreen").addEventListener("click", () => setLayout("fullscreen"));
    document.getElementById("btn-layout-vn").addEventListener("click", () => setLayout("vn"));

    // Download
    document.getElementById("btn-download").addEventListener("click", downloadPayload);

    // Load new story
    document.getElementById("btn-load-new").addEventListener("click", function() {
      document.getElementById("sidebar-file-input").click();
    });
    document.getElementById("sidebar-file-input").addEventListener("change", function(e) {
      if (e.target.files.length) handleDropZoneFile(e.target.files[0]);
      e.target.value = "";
    });

    // Drop zone
    const dzBox = document.getElementById("dz-drop-box");
    const dzFile = document.getElementById("drop-zone-file");

    dzBox.addEventListener("click", () => dzFile.click());
    dzFile.addEventListener("change", e => {
      if (e.target.files.length) handleDropZoneFile(e.target.files[0]);
      e.target.value = "";
    });
    document.getElementById("drop-zone").addEventListener("dragover", e => {
      e.preventDefault();
      document.getElementById("drop-zone").classList.add("dragging");
    });
    document.getElementById("drop-zone").addEventListener("dragleave", () => {
      document.getElementById("drop-zone").classList.remove("dragging");
    });
    document.getElementById("drop-zone").addEventListener("drop", e => {
      e.preventDefault();
      document.getElementById("drop-zone").classList.remove("dragging");
      if (e.dataTransfer.files.length) handleDropZoneFile(e.dataTransfer.files[0]);
    });

    // URL load button
    document.getElementById("dz-url-btn").addEventListener("click", () => {
      const url = document.getElementById("dz-url-input").value.trim();
      if (!url) return;
      document.getElementById("loading-screen").style.display = "flex";
      document.getElementById("loading-screen").classList.remove("fade-out");
      setLoadingStatus("Fetching…");
      hideDropZone();
      fetchAndLoad(url);
    });
    document.getElementById("dz-url-input").addEventListener("keydown", e => {
      if (e.key === "Enter") document.getElementById("dz-url-btn").click();
    });

    // Context menu
    document.getElementById("ctx-bookmark").addEventListener("click", () => {
      if (ctxTargetKey) addBookmark(ctxTargetKey);
      closeCtxMenu();
    });
    document.getElementById("ctx-bookmark-label").addEventListener("click", () => {
      if (!ctxTargetKey) return;
      const label = window.prompt("Bookmark label:");
      if (label !== null) addBookmark(ctxTargetKey, label.trim() || undefined);
      closeCtxMenu();
    });

    // Close context menu and panels on outside click
    document.addEventListener("click", e => {
      if (!e.target.closest("#ctx-menu")) closeCtxMenu();
      if (!e.target.closest("#float-controls")) {
        toggleBookmarkPanel(false);
        document.getElementById("volume-panel").classList.remove("open");
      }
    });

    // Scroll listeners
    document.getElementById("mode-fullscreen").addEventListener("scroll", onScroll, { passive: true });
    document.getElementById("vn-text-panel").addEventListener("scroll", onScroll, { passive: true });

    // Search stories button (sidebar + drop zone)
    document.getElementById("btn-search-stories").addEventListener("click", openSearchOverlay);
    document.getElementById("dz-search-btn").addEventListener("click", openSearchOverlay);

    // Search overlay close button + backdrop click
    document.getElementById("btn-search-close").addEventListener("click", closeSearchOverlay);
    document.getElementById("search-overlay").addEventListener("click", e => {
      if (e.target === document.getElementById("search-overlay")) closeSearchOverlay();
    });

    // Search input — debounced so we don't re-render on every keystroke
    document.getElementById("search-input").addEventListener("input", function() {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(() => {
        renderSearchResults(this.value.trim());
      }, 180);
    });

    // Keyboard shortcuts
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") {
        if (document.getElementById("search-overlay").classList.contains("open")) {
          closeSearchOverlay();
          return;
        }
        closeCtxMenu();
        toggleBookmarkPanel(false);
        document.getElementById("volume-panel").classList.remove("open");
      }
      if (e.key === "[" || e.key === "ArrowLeft") {
        if (e.target.tagName !== "INPUT") scrollToBeginning();
      }
      if (e.key === "]" || e.key === "ArrowRight") {
        if (e.target.tagName !== "INPUT") scrollToEnd();
      }
    });
  }

  // --------------------------------------------------------------------------
  // SECTION 17: APPLY INITIAL STATE AFTER RENDER
  // --------------------------------------------------------------------------

  function applyInitialState() {
    // Apply global background
    applyGlobalBackground();

    // Apply layout mode
    setLayout(layoutMode);

    // Apply mute state
    if (isMuted) {
      document.getElementById("btn-mute").textContent = "🔇";
      document.getElementById("btn-mute").classList.add("active");
    }

    // Apply sidebar state
    if (!sidebarOpen) {
      document.getElementById("sidebar").classList.add("collapsed");
      document.getElementById("btn-sidebar-toggle").classList.remove("active");
    }

    // Restore volume
    const savedVol = loadSetting("volume");
    if (savedVol !== null) {
      document.getElementById("volume-slider").value = savedVol;
      document.getElementById("audio-music").volume = savedVol;
    }

    // Render bookmark panel
    renderBookmarkPanel();

    // Start global music if set
    if (project.globals.music_url) {
      playMusic(project.globals.music_url);
    }
  }

  // --------------------------------------------------------------------------
  // INIT
  // --------------------------------------------------------------------------

  wireButtons();
  init();

  </script>
</body>
